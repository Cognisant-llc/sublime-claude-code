[project]
name = "claude-code-ide-sublime"
version = "0.2.0"
description = "Claude Code IDE integration plugin for Sublime Text 4"
requires-python = ">=3.8"
license = { text = "MIT" }

[dependency-groups]
dev = ["pytest"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
target-version = "py38"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B"]
ignore = ["UP006", "UP007", "UP035"]  # keep typing.Dict etc. — runtime must stay 3.8-compatible
